name: Build APK

on:
  push:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a release with this tag, for example v1.0.0. Leave empty to only build."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # packages: '' skips the action's default "sdkmanager tools", which no
      # longer exists in current cmdline-tools and fails the step.
      - uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Install SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Run unit tests
        run: |
          chmod +x gradlew
          ./gradlew test --no-daemon

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: spend-nudge-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # A release carries the APK where anyone can download it without a GitHub
      # login. Push a v* tag, or run this workflow and give it a release_tag.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ github.event.inputs.release_tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          TAG="${INPUT_TAG:-$REF_NAME}"
          cp app/build/outputs/apk/debug/app-debug.apk "spend-nudge-$TAG.apk"
          gh release create "$TAG" "spend-nudge-$TAG.apk" \
            --target "$GITHUB_SHA" \
            --title "Spend Nudge $TAG" \
            --notes "Sideload the APK below: open it on the phone, allow installing unknown apps, then grant permissions in Spend Nudge."

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/
