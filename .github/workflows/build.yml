name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # packages: '' skips the action's default "sdkmanager tools", which no
      # longer exists in current cmdline-tools and fails the step.
      - uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Install SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Run unit tests
        run: |
          chmod +x gradlew
          ./gradlew test --no-daemon

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: spend-nudge-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # Pushing a v* tag publishes a release with the APK attached, so it can be
      # downloaded without a GitHub login and without digging through runs.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "spend-nudge-${{ github.ref_name }}.apk"
          gh release create "${{ github.ref_name }}" "spend-nudge-${{ github.ref_name }}.apk" \
            --title "Spend Nudge ${{ github.ref_name }}" \
            --notes "Sideload the APK below. Open it on the phone, allow installing unknown apps, then grant permissions in Spend Nudge."

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/
